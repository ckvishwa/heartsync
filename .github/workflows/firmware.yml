name: firmware

on:
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Native unit tests
        run: pio test -e native

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        env: [esp32-s3-devkitc-1, esp32dev, esp32-s3-hub75]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # No secrets.h in CI: the build falls back to secrets.example.h.
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      # Signed releases are cut with /release-firmware, never from an unsigned CI build.
