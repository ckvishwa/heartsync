; heartsync firmware. See firmware/CLAUDE.md.
;
;   pio run                       build the default board (ESP32-S3, SSD1306 OLED)
;   pio run -e esp32dev           build for a classic ESP32 dev board (SSD1306 OLED)
;   pio run -e esp32-s3-small-led build with the old WS2812B matrix driver (reference)
;   pio run -e esp32-s3-hub75     build with the HUB75 driver (stub until Phase 1b)
;   pio test -e native            run host unit tests (no hardware)
;
; DISPLAY_DRIVER selects the display at compile time: ssd1306, small_led, or hub75.

[platformio]
default_envs = esp32-s3-devkitc-1

[esp32_base]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; BLE Wi-Fi setup (Phase 3, ADR 0009). NimBLE is pinned exactly: the setup
; security (LE Secure Connections only) is checked against this version.
[ble]
build_flags =
    -DHS_BLE_SETUP=1
    -DCONFIG_BT_NIMBLE_SM_SC_ONLY=1
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2

; Bench-only conveniences (esp32dev bench boards). Never in a release env:
;   HS_DEV_WIFI_FALLBACK  use secrets.h Wi-Fi when no Wi-Fi was set up over BLE
;   HS_DEV_SERIAL_TOKEN   accept `token <jwt>` over USB serial
[bench]
build_flags =
    -DHS_DEV_WIFI_FALLBACK=1
    -DHS_DEV_SERIAL_TOKEN=1

[env:esp32-s3-devkitc-1]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_base.build_flags}
    ${ble.build_flags}
    -DHS_BOARD_ESP32_S3_DEVKITC
    -DDISPLAY_DRIVER=ssd1306
lib_deps =
    ${esp32_base.lib_deps}
    ${ble.lib_deps}
    olikraus/U8g2@^2.36.2

[env:esp32dev]
extends = esp32_base
board = esp32dev
build_flags =
    ${esp32_base.build_flags}
    ${ble.build_flags}
    ${bench.build_flags}
    -DHS_BOARD_ESP32_DEV
    -DDISPLAY_DRIVER=ssd1306
lib_deps =
    ${esp32_base.lib_deps}
    ${ble.lib_deps}
    olikraus/U8g2@^2.36.2

; Old bench display (8x8 WS2812B matrix). Kept compiling so the driver does not rot.
[env:esp32-s3-small-led]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_base.build_flags}
    -DHS_BOARD_ESP32_S3_DEVKITC
    -DDISPLAY_DRIVER=small_led
lib_deps =
    ${esp32_base.lib_deps}
    fastled/FastLED@^3.9.0

[env:esp32-s3-hub75]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_base.build_flags}
    -DHS_BOARD_ESP32_S3_DEVKITC
    -DDISPLAY_DRIVER=hub75

; Host tests: only hardware-free modules are compiled.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<art/> +<events/> +<display/MonoCanvas.cpp> +<cloud/> +<setup/>
build_flags =
    -std=gnu++17
    -DHS_NATIVE
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -Iinclude
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
